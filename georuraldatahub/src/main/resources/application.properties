# Nome da aplicação
spring.application.name=georuraldatahub
server.port=8080

## Log
# Exibe as instruções SQL geradas pelo Hibernate
logging.level.org.hibernate.SQL = debug

# Formato de SQL para debug
spring.jpa.properties.hibernate.format_sql=true

## Importação de configuração externa
# Importa variáveis de um arquivo .env
spring.config.import=optional:file:.env[.properties]

## Configuração do banco de dados
spring.datasource.url=${CHAVE_URL_DATASOURCE}
spring.datasource.username=${CHAVE_USERNAME_DATABASE}
spring.datasource.password=${CHAVE_DATABASE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Modo DDL do Hibernate (create, create-drop, validate, update)
# "validate" = apenas valida o schema contra as entidades, sem alterar nada
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

## Configuração do Object Storage da OCI
oci.objectstorage.namespace=${OCI_NAMESPACE}
oci.objectstorage.bucket-name=${OCI_BUCKET_NAME}
oci.objectstorage.compartment-id=${OCI_COMPARTMENT_ID}

## Upload de arquivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

## Storage local (fallback/desenvolvimento, enquanto a integração com a OCI não estiver pronta)
storage.raw-zone.base-path=./storage/raw