# Nome da aplicação
spring.application.name=georuraldatahub

## Log
# Exibe as instruções SQL geradas pelo Hibernate
logging.level.org.hibernate.SQL = debug

# Formato de SQL para debug 
spring.jpa.properties.hibernate.format_sql=true

## Importação de configuração externa
# Importa variáveis de um arquivo .env 
spring.config.import=optional:file:.env[.properties]

## Configuração do banco de dados
spring.datasource.url=${CHAVE_URL_DATASOURCE}
spring.datasource.username=${CHAVE_USERNAME_DATABASE}
spring.datasource.password=${CHAVE_DATABASE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

## Configuração do Object Storage da OCI
oci.objectstorage.namespace=${OCI_NAMESPACE}
oci.objectstorage.bucket-name=${OCI_BUCKET_NAME}
oci.objectstorage.compartment-id=${OCI_COMPARTMENT_ID}
environmental.enabled=true

# Modo DDL do Hibernate (create, create-drop, validate, update)
# "validate" = apenas valida o schema contra as entidades, sem alterar nada
spring.jpa.hibernate.ddl-auto=validate

## Limite de upload de arquivos (multipart)
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# Coleta automática: usa apenas fontes, conjuntos e usuários já cadastrados.
collection.scheduling.enabled=false
collection.scheduling.cron=0 0 10 * * *
collection.max-download-bytes=268435456
collection.max-total-bytes=536870912
# ZIP nacional do SFB: limite expandido em disco, separado da saída filtrada.
collection.max-expanded-bytes=2147483648
collection.page-size=1000
collection.max-features=100000
# Para ativar, configure jobs reais e collection.scheduling.enabled=true.
# Exemplo (substitua os IDs pelos registros do ambiente):
# collection.jobs[0].source-id=1
# collection.jobs[0].request.product=INPE_QUEIMADAS
# collection.jobs[0].request.dataset-id=1
# collection.jobs[0].request.user-id=1
# collection.jobs[0].request.competence=D-1

# Prazo total por download oficial, incluindo o corpo, redirecionamentos e tentativas.
collection.request-timeout-seconds=90
# Caminho opcional; vazio procura .oci/config no projeto ou em ~/.oci/config.
oci.config-file=${OCI_CONFIG_FILE:}
oci.config-profile=${OCI_CONFIG_PROFILE:DEFAULT}

# Prazo total da coleta, somando downloads, páginas e processamento.
collection.max-duration-seconds=180

# O DDL de execucao_tratamento e raster deve estar aplicado para habilitar o fluxo.
processing.persistence.enabled=${PROCESSING_PERSISTENCE_ENABLED:false}
processing.timeout-seconds=120
processing.max-input-bytes=1073741824
processing.max-output-bytes=134217728
processing.max-features=100000

# Explícito para preservar o comportamento das consultas HTTP existentes.
spring.jpa.open-in-view=true

## Keycloak (autenticação e autorização por perfil)
# O back-end é um OAuth2 Resource Server: valida o JWT emitido pelo realm.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/georural}
# Opcional: busca as chaves por um endereço interno (ex.: http://keycloak:8080/... no docker)
# mantendo a validação do "iss" pelo issuer-uri público.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
# false libera todas as rotas (apenas desenvolvimento local sem Keycloak)
security.keycloak.enabled=${KEYCLOAK_ENABLED:true}
# Client público do portal Vue; os client roles dele também são aceitos
security.keycloak.client-id=${KEYCLOAK_CLIENT_ID:georural-frontend}
# Origens do front liberadas no CORS (separadas por vírgula)
security.keycloak.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
