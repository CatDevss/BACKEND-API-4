# Nome da aplicação
spring.application.name=georuraldatahub

# Log
# Exibe as instruções SQL geradas pelo Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Formato de SQL para debug
spring.jpa.properties.hibernate.format_sql=true

# Importação de configuração externa
# Importa variáveis de um arquivo .env
spring.config.import=optional:file:.env[.properties]

# Configuração do banco de dados
spring.datasource.url=${CHAVE_URL_DATASOURCE}
spring.datasource.username=${CHAVE_USERNAME_DATABASE}
spring.datasource.password=${CHAVE_DATABASE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuração do Object Storage da OCI
oci.objectstorage.namespace=${OCI_NAMESPACE}
oci.objectstorage.bucket-name=${OCI_BUCKET_NAME}
oci.objectstorage.compartment-id=${OCI_COMPARTMENT_ID}

# Configuração do arquivo de acesso à OCI
# Caminho opcional: procura .oci/config no projeto ou em ~/.oci/config
oci.config-file=${OCI_CONFIG_FILE:}
oci.config-profile=${OCI_CONFIG_PROFILE:DEFAULT}

# Modo DDL do Hibernate
# validate apenas valida o schema contra as entidades, sem alterá-las
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

# Limite de upload de arquivos (multipart)
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

# Configuração da coleta automática
# Usa apenas fontes, conjuntos e usuários já cadastrados
collection.scheduling.enabled=false
collection.scheduling.cron=0 0 10 * * *
collection.max-download-bytes=67108864
collection.max-total-bytes=134217728
collection.page-size=1000
collection.max-features=100000

# Prazo total por download oficial, incluindo o corpo,
# redirecionamentos e tentativas
collection.request-timeout-seconds=90

# Prazo total da coleta, somando downloads, páginas e processamento
collection.max-duration-seconds=180

# Para ativar a coleta automática, configure jobs reais
# e defina collection.scheduling.enabled=true
# Exemplo (substitua os IDs pelos registros do ambiente):
# collection.jobs[0].source-id=1
# collection.jobs[0].request.product=INPE_QUEIMADAS
# collection.jobs[0].request.dataset-id=1
# collection.jobs[0].request.user-id=1
# collection.jobs[0].request.competence=D-1

# Configuração da persistência de processamento
# O DDL de execucao_tratamento e raster deve estar aplicado
# para habilitar o fluxo
processing.persistence.enabled=${PROCESSING_PERSISTENCE_ENABLED:true}
processing.timeout-seconds=120
processing.max-input-bytes=1073741824
processing.max-output-bytes=134217728
processing.max-features=100000