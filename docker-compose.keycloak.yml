# Keycloak para desenvolvimento local do GeoRural DataHub.
#   docker compose -f docker-compose.keycloak.yml up -d
# Console: http://localhost:8081  (admin / admin)
# Realm "georural" importado de keycloak/realm-georural.json
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    container_name: georural-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-georural.json:/opt/keycloak/data/import/realm-georural.json:ro
